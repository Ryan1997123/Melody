name: Deploy React Prototype

on:
  push:
    branches:
      - copilot/change-prototype-screen-navigation
    paths:
      - prototype-react/**
      - .github/workflows/deploy-prototype.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: prototype-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototype-react/package-lock.json
      - run: npm ci
        working-directory: prototype-react
      - run: npm run lint
        working-directory: prototype-react
      - run: npm run build
        working-directory: prototype-react
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype-react/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4