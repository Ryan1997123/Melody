<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sleeve Lo-fi Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a design-tool canvas. Frame list on the left, one 390x844 frame centred on a grey canvas.
   On phones the frame becomes the whole screen and the frame list opens from a pill at the top. */
:root {
  /* Prototype chrome (follows the viewer's theme) */
  --canvas: #e3e3df;
  --panel: #f7f7f4;
  --chrome-ink: #1a1a19;
  --chrome-muted: #686864;
  --chrome-line: #d3d3ce;
  --chrome-hover: #ebebe7;
  --chrome-active: #1a1a19;
  --chrome-on-active: #ffffff;
  --frame-shadow: 0 1px 2px rgba(0,0,0,.10), 0 16px 40px rgba(0,0,0,.14);
  --hotspot: #0d8bff;
  --hotspot-fill: rgba(13,139,255,.18);
  --on-hotspot: #ffffff;

  /* Wireframe (one fixed look, the same in both themes) */
  --ink: #111111;
  --paper: #ffffff;
  --card: #f0f0f0;
  --fill: #d9d9d9;
  --ph: #e0e0e0;
  --mute: #555555;
  --hint: #7a7a7a;
  --line-ph: #8c8c8c;
  --line-soft: #9a9a9a;
  --scrim: #8c8c8c;

  --f-display: "Archivo Black", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --f-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Work Sans", "Helvetica Neue", Arial, sans-serif;

  --b: 3px solid var(--ink);
  --sh-card: 6px 6px 0 var(--ink);
  --sh-btn: 5px 5px 0 var(--ink);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #1b1b1a; --panel: #242423; --chrome-ink: #ecece8; --chrome-muted: #a1a19c;
    --chrome-line: #3a3a38; --chrome-hover: #2f2f2d; --chrome-active: #ecece8; --chrome-on-active: #1a1a19;
    --frame-shadow: 0 1px 2px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #1b1b1a; --panel: #242423; --chrome-ink: #ecece8; --chrome-muted: #a1a19c;
  --chrome-line: #3a3a38; --chrome-hover: #2f2f2d; --chrome-active: #ecece8; --chrome-on-active: #1a1a19;
  --frame-shadow: 0 1px 2px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; }
body { height: 100%; margin: 0; background: var(--canvas); color: var(--chrome-ink); font: 14px/1.4 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---------- Prototype chrome ---------- */
.app { height: 100%; display: flex; min-height: 0; }
.panel { width: 280px; flex: none; display: flex; flex-direction: column; gap: 22px; padding: 24px 18px; background: var(--panel); border-right: 1px solid var(--chrome-line); overflow-y: auto; }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.eyebrow { margin: 0; font: 700 11px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--chrome-muted); }
.panel h1 { margin: 6px 0 0; font: 400 30px/1 var(--f-display); letter-spacing: -.01em; }
.panel-sub { margin: 8px 0 0; color: var(--chrome-muted); font-size: 13px; line-height: 1.45; max-width: 32ch; }
.panel-close { display: none; padding: 8px 12px; border: 1px solid var(--chrome-line); border-radius: 6px; background: var(--canvas); font: 700 13px var(--f-ui); }
.frames { display: flex; flex-direction: column; gap: 1px; }
.group { margin: 14px 8px 6px; font: 700 11px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--chrome-muted); }
.group:first-child { margin-top: 0; }
.fr { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; border: 0; border-radius: 6px; background: none; text-align: left; font: 500 13.5px/1.2 var(--f-ui); }
.fr:hover { background: var(--chrome-hover); }
.fr .n { width: 18px; flex: none; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--chrome-muted); }
.fr .tag { margin-left: auto; padding: 2px 6px; border: 1px solid var(--chrome-line); border-radius: 4px; font-size: 10.5px; letter-spacing: .02em; color: var(--chrome-muted); }
.fr[aria-current="true"] { background: var(--chrome-active); color: var(--chrome-on-active); }
.fr[aria-current="true"] .n, .fr[aria-current="true"] .tag { color: inherit; border-color: currentColor; }
.box { display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 1px solid var(--chrome-line); }
.box h2 { margin: 0; font: 700 11px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--chrome-muted); }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links button { padding: 5px 9px; border: 1px solid var(--hotspot); border-radius: 999px; background: none; color: var(--chrome-ink); font: 600 12px var(--f-ui); }
.links button:hover { background: var(--hotspot); color: var(--on-hotspot); }
.links .none { font-size: 12.5px; color: var(--chrome-muted); }
.switch { display: flex; align-items: center; gap: 9px; font: 600 13px var(--f-ui); cursor: pointer; }
.switch input { width: 16px; height: 16px; margin: 0; accent-color: var(--hotspot); }
kbd { margin-left: auto; padding: 1px 6px; border: 1px solid var(--chrome-line); border-bottom-width: 2px; border-radius: 4px; font: 600 11px var(--f-ui); color: var(--chrome-muted); }
.ctl-row { display: flex; gap: 6px; }
.ctl { flex: 1; padding: 8px 6px; border: 1px solid var(--chrome-line); border-radius: 6px; background: var(--canvas); font: 700 12px var(--f-ui); }
.ctl:hover { border-color: var(--chrome-muted); }
.tip { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--chrome-muted); }

.stage { flex: 1; min-width: 0; position: relative; display: grid; place-items: center; padding: 44px 24px 24px; overflow: hidden; }
.frame-box { position: relative; width: calc(390px * var(--s, 1)); height: calc(844px * var(--s, 1)); }
.frame-label { position: absolute; bottom: 100%; left: 0; right: 0; display: flex; justify-content: space-between; gap: 12px; padding-bottom: 8px; font: 600 12px/1 var(--f-ui); color: var(--chrome-muted); white-space: nowrap; }
.frame-label b { color: var(--chrome-ink); font-weight: 700; }
.frame { position: absolute; top: 0; left: 0; width: 390px; height: 844px; transform: scale(var(--s, 1)); transform-origin: 0 0; overflow: hidden; background: var(--paper); box-shadow: var(--frame-shadow); --home: 30px; }
.orig { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; pointer-events: none; z-index: 20; background: var(--paper); }
.pill { display: none; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 30; align-items: center; gap: 6px; padding: 6px 12px; border: 0; border-radius: 999px; background: var(--hotspot); color: var(--on-hotspot); font: 700 12px/1 var(--f-ui); white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.pill svg { width: 12px; height: 12px; }

@media (max-width: 719px) {
  .panel { display: none; position: fixed; inset: 0; z-index: 50; width: auto; border: 0; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .app.open .panel { display: flex; }
  .panel-close { display: inline-flex; }
  .stage { display: block; padding: 0; }
  .frame-box { width: 100%; height: 100%; }
  .frame { inset: 0; width: 100%; height: 100%; transform: none; box-shadow: none; --home: 10px; }
  .frame-label { display: none; }
  .pill { display: inline-flex; }
}

/* ---------- Wireframe screens ---------- */
.screen { position: absolute; inset: 0; color: var(--ink); font: 400 15px/1.35 var(--f-body); }
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--paper); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; display: flex; flex-direction: column; gap: 22px; padding: 56px 20px 28px; }
.scroll::-webkit-scrollbar { display: none; }
.scroll > * { flex-shrink: 0; }
.screen p { margin: 0; }
.screen :focus-visible { outline: 3px solid var(--hotspot); outline-offset: 2px; }

.h-xl { margin: 0; font: 400 47px/1 var(--f-display); letter-spacing: -.02em; }
.h-page { margin: 0; font: 400 36px/1.1 var(--f-display); letter-spacing: -.01em; }
.sheet .h-page { font-size: 31px; }
.h-sec { margin: 0; font: 400 24px/1.1 var(--f-display); }
.h-card { margin: 0; font: 400 20px/1.3 var(--f-display); }
.lead { color: var(--mute); font-size: 16px; line-height: 1.22; }
.lead.roomy { font-size: 15.5px; line-height: 1.42; }
.head { display: flex; flex-direction: column; gap: 8px; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.title-row.start { justify-content: flex-start; gap: 24px; }
.h-mid { font-size: 27px; }

.card { border: var(--b); background: var(--paper); padding: 18px; }
.card.fill { background: var(--card); }
.sh { box-shadow: var(--sh-card); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border: var(--b); background: var(--paper); color: var(--ink); font: 800 15px/1 var(--f-ui); white-space: nowrap; transition: transform .07s, box-shadow .07s; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.pri { background: var(--fill); }
.btn.sh { box-shadow: var(--sh-btn); }
.btn.sh:active, .play.sh:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
.btn:not(.sh):active { background: var(--fill); }
.btn.big { min-height: 56px; font-size: 17px; }
.btn.big.sh { box-shadow: var(--sh-card); }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 0 12px; font-size: 14px; }
.btn[disabled] { color: var(--hint); cursor: not-allowed; }
.link { align-self: center; border: 0; background: none; padding: 4px 0; color: var(--ink); font: 800 15px/1.2 var(--f-ui); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.label { display: block; font: 800 14px/1 var(--f-ui); }
.field { display: block; width: 100%; border: var(--b); border-radius: 0; background: var(--paper); padding: 12px 14px; color: var(--ink); font: 400 16px/1.3 var(--f-body); outline: none; resize: none; -webkit-appearance: none; appearance: none; }
.field::placeholder, .search input::placeholder { color: var(--hint); opacity: 1; }
.field:focus { box-shadow: var(--sh-btn); }
.search { display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 14px; border: var(--b); background: var(--paper); }
.search:focus-within { box-shadow: var(--sh-btn); }
.search svg { width: 21px; height: 21px; flex: none; color: var(--mute); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 0; font: 400 16px var(--f-body); -webkit-appearance: none; appearance: none; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }

.av, .art { display: block; flex: none; width: var(--sz); height: var(--sz); border: var(--b); background: var(--ph); overflow: hidden; }
.av svg { display: block; width: 100%; height: 100%; }
.av.thin { border-width: 2.5px; }
.icon-btn { display: grid; place-items: center; width: 44px; height: 44px; flex: none; padding: 0; border: var(--b); background: var(--paper); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:active { background: var(--fill); }
.back { height: 40px; }
.bare { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 0; border: 0; background: none; text-align: left; }

/* lists */
.rows { list-style: none; margin: 0; padding: 0; }
.rows > li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 2px solid var(--ink); }
.row-main { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; padding: 0; border: 0; background: none; text-align: left; }
.tt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.tt b { overflow: hidden; font: 800 16px/1.25 var(--f-ui); white-space: nowrap; text-overflow: ellipsis; }
.tt > span { overflow: hidden; color: var(--mute); font-size: 15px; white-space: nowrap; text-overflow: ellipsis; }
.rank { width: 24px; flex: none; text-align: center; font: 400 18px var(--f-display); }
.play { display: grid; place-items: center; width: 44px; height: 44px; flex: none; padding: 0; border: var(--b); background: var(--fill); color: var(--ink); transition: transform .07s, box-shadow .07s; }
.play svg { width: 15px; height: 15px; }
.play.on { background: var(--ink); color: var(--paper); }
.play.sh { box-shadow: var(--sh-btn); }

/* tab bar */
.tabbar { position: relative; z-index: 2; flex: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 10px 4px var(--home); border-top: 3px solid var(--ink); background: var(--paper); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 55px; padding: 0; border: 0; background: none; font: 800 11px/1 var(--f-ui); }
.tab svg { width: 22px; height: 22px; }
.tab.on { background: var(--fill); }
.fab-slot { position: relative; }
.fab { position: absolute; top: -32px; left: 50%; display: grid; place-items: center; width: 64px; height: 64px; margin-left: -32px; padding: 0; border: 0; background: var(--ink); color: var(--paper); box-shadow: 4px 4px 0 var(--ink); transition: transform .07s; }
.fab svg { width: 26px; height: 26px; }
.fab:active { transform: translate(2px, 2px); }

/* sheets */
.scr.sheet { background: var(--scrim); }
.scrim { flex: none; height: 55px; padding: 0; border: 0; background: var(--scrim); }
.sheet-body { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 3px solid var(--ink); background: var(--paper); }
.grabber { position: absolute; top: 10px; left: 50%; width: 44px; height: 5px; margin-left: -22px; background: var(--ink); }
.sheet .scroll { padding-top: 34px; }
.sheet-foot { flex: none; padding: 10px 20px var(--home); background: var(--paper); }

/* stepper */
.stepper { display: flex; align-items: center; gap: 10px; font: 800 15px/1 var(--f-ui); }
.step { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.step i { display: grid; place-items: center; width: 28px; height: 28px; border: 3px solid var(--ink); background: var(--paper); font: 800 13px/1 var(--f-ui); font-style: normal; }
.step i svg { width: 14px; height: 14px; }
.step.on i { background: var(--fill); }
.step.todo { color: var(--mute); }
.step.todo i { border-color: var(--line-soft); }
.stepper hr { flex: 1; min-width: 16px; margin: 0; border: 0; border-top: 2px solid var(--ink); }
.kicker { font: 800 15px/1 var(--f-ui); color: var(--mute); }

/* sign in */
.signin { padding-top: 96px; gap: 0; }
.tagline { margin: 20px 0 24px !important; font: 800 17px/1.5 var(--f-ui); max-width: 32ch; }
.form { display: flex; flex-direction: column; gap: 8px; padding: 22px 22px 18px; }
.form .label { margin-top: 8px; }
.form .label:first-child { margin-top: 0; }
.form .btn { margin: 10px 0 6px; }
.or { display: flex; align-items: center; gap: 22px; margin: 20px 0 14px; color: var(--mute); font: 800 14px var(--f-ui); }
.or::before, .or::after { content: ""; flex: 1; border-top: 2px solid var(--ink); }
.signin .alt { display: flex; flex-direction: column; gap: 12px; }
.signin .alt .btn { min-height: 52px; font-size: 16px; }
.signin .field { padding-block: 10px; }
.signin > .link { margin-top: 28px; }

/* discover */
.chips { display: flex; flex-wrap: wrap; gap: 9px 8px; }
.chip { height: 32px; padding: 0 12px; border: 2.5px solid var(--ink); background: var(--paper); font: 800 14px/1 var(--f-ui); }
.chip[aria-pressed="true"] { background: var(--fill); }
.talk { display: flex; flex-direction: column; gap: 10px; }
.talk .h-card { margin-bottom: 2px; }
.talk-item { padding: 0; border: 0; background: none; text-align: left; font: 400 15px/1.3 var(--f-body); }
.talk-item b { font: 800 15px var(--f-ui); }

/* friends */
.req { display: flex; flex-direction: column; gap: 14px; }
.req-row { display: flex; align-items: center; gap: 10px; }
.req-row .who { flex: 1; min-width: 0; }
.req-row .who b { overflow: hidden; font: 800 15px var(--f-ui); white-space: nowrap; text-overflow: ellipsis; }
.req-row .btn { min-height: 42px; padding: 0 11px; font-size: 13.5px; }
.strip { display: flex; gap: 16px; }
.ftile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; border: 0; background: none; font: 800 11.5px/1 var(--f-ui); }
.post { display: flex; flex-direction: column; gap: 14px; }
.post header, .comment header { display: flex; align-items: center; gap: 12px; }
.post header b, .comment header b { font: 800 16px var(--f-ui); }
.post time, .comment time { margin-left: auto; font-size: 13px; color: var(--mute); }
.post > p, .comment > p { font-size: 16px; line-height: 1.5; }
.post footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.songline { font-size: 15px; }
.songline b { font: 800 15px var(--f-ui); }
.songline .ar { color: var(--mute); }
.like { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border: var(--b); background: var(--paper); font: 800 15px/1 var(--f-ui); font-variant-numeric: tabular-nums; }
.like svg { width: 15px; height: 15px; }
.like.on { background: var(--fill); }
.like.on svg path { fill: currentColor; }

/* chats */
.chat-row .tt > span { font-size: 15px; }
.chat-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; margin-left: auto; padding-left: 8px; color: var(--mute); font-size: 13px; }
.dot { width: 16px; height: 16px; border: 2.5px solid var(--ink); background: var(--fill); }
.dashed { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 22px 20px; border: 3px dashed var(--ink); }
.dashed h3 { margin: 0; font: 800 17px/1.2 var(--f-ui); }
.dashed p { color: var(--mute); font-size: 16px; line-height: 1.25; }
.dashed .btn { margin-top: 10px; }

/* profile */
.me-card { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 22px 18px 24px; text-align: center; }
.handle-xl { margin: 6px 0 0; font: 400 23px/1.15 var(--f-display); overflow-wrap: anywhere; }
.btn-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 8px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.stat { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 18px; text-align: left; font: inherit; }
.stat b { font: 400 30px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font: 800 15px var(--f-ui); }
.spot { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.spot h3 { margin: 0; font: 400 20px var(--f-display); }
.spot p { color: var(--mute); font-size: 16px; line-height: 1.25; }
.spot .btn { margin-top: 6px; }

/* drop */
.picked { display: flex; align-items: center; gap: 14px; }
.picked .tt b { font-size: 17px; }
.picked .tt > span { font-size: 16px; }
.picked .btn { margin-left: auto; }
.helper { display: flex; justify-content: space-between; gap: 16px; color: var(--mute); font-size: 13px; line-height: 1.2; }
.helper span:last-child { font-variant-numeric: tabular-nums; }
.why { display: flex; flex-direction: column; gap: 12px; }
.why .label { margin-top: 6px; }
.why .btn.big { margin-top: 10px; }
.why textarea { min-height: 124px; }

/* song */
.cover { align-self: center; width: 218px; height: 218px; max-width: 100%; margin: -4px 0 2px; border: var(--b); background: var(--ph); box-shadow: 10px 10px 0 var(--ink); }
.cover svg { display: block; width: 100%; height: 100%; }
.song-meta { display: flex; flex-direction: column; gap: 6px; text-align: center; }
.song-title { margin: 0; font: 400 28px/1.1 var(--f-display); }
.song-sub { color: var(--mute); font: 800 15px var(--f-ui); }
.song-actions { display: flex; justify-content: center; gap: 12px; }
.song-actions .play { width: 50px; height: 50px; }
.composer { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.composer .btn { align-self: flex-end; }
.comment { display: flex; flex-direction: column; gap: 12px; padding: 16px; }

/* send */
.send-song { display: flex; align-items: center; gap: 14px; }
.picks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 6px; }
.pick { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; border: 0; background: none; font: 800 13px/1 var(--f-ui); }
.pick .av { border-width: 3px; }
.pick[aria-pressed="true"] .av { border-width: 6px; }
.pick .chk { position: absolute; top: -7px; left: calc(50% + 15px); display: none; place-items: center; width: 24px; height: 24px; border: 3px solid var(--ink); background: var(--fill); }
.pick .chk svg { width: 13px; height: 13px; }
.pick[aria-pressed="true"] .chk { display: grid; }
.msg-field { display: flex; flex-direction: column; gap: 10px; }

/* conversation */
.convo-head { flex: none; display: flex; align-items: center; gap: 14px; padding: 54px 20px 12px; border-bottom: 3px solid var(--ink); }
.convo-head h1 { flex: 1; min-width: 0; margin: 0; font: 400 20px var(--f-display); }
.convo-head .av { padding: 0; }
.msgs { gap: 0; padding: 16px 20px; }
.msgs-inner { min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; }
.day { align-self: center; color: var(--mute); font: 800 12px var(--f-ui); }
.bub { max-width: 82%; padding: 10px 14px; border: var(--b); background: var(--paper); font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.bub.me { align-self: flex-end; background: var(--fill); }
.bub.them { align-self: flex-start; }
.bub-song { display: flex; align-items: center; gap: 12px; padding: 9px; }
.bub-song .row-main { gap: 12px; }
.bub-song .play { width: 38px; height: 38px; margin-left: 12px; }
.stamp { color: var(--mute); font-size: 12px; }
.stamp.me { align-self: flex-end; }
.composer-bar { flex: none; display: flex; gap: 10px; padding: 14px 20px var(--home); border-top: 3px solid var(--ink); background: var(--paper); }
.composer-bar .field { flex: 1; min-width: 0; }
.composer-bar .icon-btn { width: 50px; height: auto; background: var(--fill); }

/* someone's profile */
.mini { display: flex; flex-direction: column; gap: 14px; padding: 16px; }
.mini p { font-size: 16px; }

/* add friends */
.invite { display: flex; align-items: center; gap: 12px; padding: 16px; }
.invite .tt b { font-size: 15px; white-space: normal; }
.invite .tt > span { white-space: normal; font-size: 14px; }
.invite .btn { margin-left: auto; }
.add-btn { min-width: 0; }
.empty { padding: 18px 0; color: var(--mute); font-size: 15px; }

/* avatar editor */
.av-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.av-head .link { justify-self: start; }
.av-head h1 { margin: 0; font: 400 20px var(--f-display); white-space: nowrap; }
.av-head .icon-btn { justify-self: end; }
.av-preview { align-self: center; box-shadow: var(--sh-card); }
.seg { display: flex; gap: 8px; }
.seg button { flex: auto; height: 40px; padding: 0 8px; border: var(--b); background: var(--paper); font: 800 14px/1 var(--f-ui); white-space: nowrap; }
.seg button[aria-selected="true"] { background: var(--fill); }
.rule { margin: 0 -20px; border: 0; border-top: 3px solid var(--ink); }
.opts { display: flex; flex-direction: column; gap: 18px; }
.opt { display: grid; grid-template-columns: 1fr 44px minmax(0, 140px) 44px; align-items: center; gap: 10px; }
.opt > span { font: 800 16px var(--f-ui); }
.opt output { display: grid; place-items: center; height: 44px; border: var(--b); font: 800 16px var(--f-ui); }
.swatch-group { display: flex; flex-direction: column; gap: 12px; }
.swatch-group > span { font: 800 16px var(--f-ui); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 42px; height: 42px; padding: 0; border: 2.5px solid var(--ink); }
.sw[aria-pressed="true"] { border-width: 5px; }

/* toast */
.toast { position: absolute; left: 20px; right: 20px; bottom: 118px; z-index: 15; display: flex; justify-content: center; pointer-events: none; opacity: 0; transform: translateY(8px); transition: opacity .18s, transform .18s; }
.toast span { padding: 11px 14px; border: var(--b); background: var(--ink); color: var(--paper); font: 700 14px/1.3 var(--f-ui); text-align: center; box-shadow: 4px 4px 0 var(--line-ph); }
.toast.show { opacity: 1; transform: none; }

/* hotspots: always-on mode, and the flash when you click a dead area */
.frame.hot .screen :is(button, input, textarea, .search) { outline: 2px solid var(--hotspot); outline-offset: -1px; background-image: linear-gradient(var(--hotspot-fill), var(--hotspot-fill)); }
.frame.hot .screen .search input { outline: 0; background-image: none; }

/* transitions between frames */
@keyframes from-right { from { transform: translateX(28px); opacity: 0; } }
@keyframes from-left { from { transform: translateX(-28px); opacity: 0; } }
@keyframes from-below { from { transform: translateY(70px); } }
@keyframes fade { from { opacity: 0; } }
.a-push > .scr:not(.sheet), .a-push > .sheet .sheet-body > * { animation: from-right .2s ease-out; }
.a-back > .scr:not(.sheet), .a-back > .sheet .sheet-body > * { animation: from-left .2s ease-out; }
.a-up .sheet-body { animation: from-below .24s cubic-bezier(.2, .8, .2, 1); }
.a-up .scrim { animation: fade .2s ease-out; }
.a-fade > .scr { animation: fade .16s ease-out; }
@media (prefers-reduced-motion: reduce) {
  .screen *, .toast, .btn { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="panel" id="panel" aria-label="Prototype controls">
    <div class="panel-head">
      <div>
        <p class="eyebrow">Lo-fi prototype</p>
        <h1>Sleeve</h1>
        <p class="panel-sub">13 frames, one at a time. Tap through it like the real app, or jump to any frame here.</p>
      </div>
      <button class="panel-close" id="panelClose" type="button">Done</button>
    </div>
    <nav class="frames" id="frameList" aria-label="Frames"></nav>
    <section class="box" aria-labelledby="linksTitle">
      <h2 id="linksTitle">Links from this frame</h2>
      <div class="links" id="links"></div>
    </section>
    <section class="box" aria-label="View options">
      <label class="switch" for="hotToggle"><input type="checkbox" id="hotToggle"> Show hotspots <kbd>H</kbd></label>
      <label class="switch" for="origToggle"><input type="checkbox" id="origToggle"> Overlay original frame <kbd>O</kbd></label>
      <div class="ctl-row">
        <button class="ctl" id="prevBtn" type="button">← Prev</button>
        <button class="ctl" id="nextBtn" type="button">Next →</button>
        <button class="ctl" id="restartBtn" type="button">Restart</button>
      </div>
      <p class="tip">Click anywhere that isn’t clickable and the hotspots flash blue. Arrow keys step through frames; Esc goes back.</p>
    </section>
  </aside>

  <main class="stage" id="stage">
    <div class="frame-box" id="frameBox">
      <div class="frame-label"><span><b id="frameName">Sign in</b></span><span id="frameNum">01 / 13</span></div>
      <div class="frame" id="frame">
        <div class="screen" id="screen"></div>
        <img class="orig" id="orig" alt="" hidden>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </div>
    <button class="pill" id="pill" type="button" aria-controls="panel" aria-expanded="false"></button>
  </main>
</div>

<script>
(() => {
  /* ---------- Frames ---------- */
  const FRAMES = [
    { id: 'signin', name: 'Sign in', file: '01-sign-in.png', group: 'Start' },
    { id: 'discover', name: 'Discover', file: '02-discover.png', group: 'Tabs' },
    { id: 'friends', name: 'Friends', file: '03-friends.png', group: 'Tabs' },
    { id: 'chats', name: 'Chats', file: '04-chats.png', group: 'Tabs' },
    { id: 'profile', name: 'Profile', file: '05-profile.png', group: 'Tabs' },
    { id: 'drop-pick', name: 'Drop: pick a song', file: '06-drop-pick-a-song.png', group: 'Drop a song', sheet: true, chain: ['discover'] },
    { id: 'drop-why', name: 'Drop: say why', file: '07-drop-say-why.png', group: 'Drop a song', sheet: true, chain: ['discover', 'drop-pick'] },
    { id: 'song', name: 'Song page', file: '08-song-page.png', group: 'Songs', chain: ['discover'] },
    { id: 'send', name: 'Send to friends', file: '09-send-to-friends.png', group: 'Songs', sheet: true, chain: ['discover', 'song'] },
    { id: 'conversation', name: 'Conversation', file: '10-conversation.png', group: 'People', chain: ['chats'] },
    { id: 'person', name: 'Someone’s profile', file: '11-someones-profile.png', group: 'People', chain: ['friends'] },
    { id: 'add-friends', name: 'Add friends', file: '12-add-friends.png', group: 'People', chain: ['friends'] },
    { id: 'avatar', name: 'Avatar editor', file: '13-avatar-editor.png', group: 'Profile', sheet: true, chain: ['profile'] },
  ];
  const byId = Object.fromEntries(FRAMES.map((f, i) => [f.id, { ...f, n: i + 1 }]));
  const TABS = ['discover', 'friends', 'chats', 'profile'];

  /* ---------- Icons ---------- */
  function svg(inner, w = 2) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
  }
  const ic = {
    compass: svg('<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2.2 4.8-4.8 2.2 2.2-4.8z"/>'),
    people: svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.4-3.6 3.1-6 6.5-6s6.1 2.4 6.5 6"/><path d="M15.5 4.8a3.5 3.5 0 0 1 0 6.4"/><path d="M17.5 14.4c2.2.8 3.6 2.9 4 5.6"/>'),
    chat: svg('<path d="M12 3.5a8.5 8.5 0 1 1-4.2 15.9L3.5 20.5l1.1-4.1A8.5 8.5 0 0 1 12 3.5z"/>'),
    smile: svg('<circle cx="12" cy="12" r="9"/><path d="M8.5 13.5c.9 1.5 2.1 2.2 3.5 2.2s2.6-.7 3.5-2.2"/>'),
    search: svg('<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/>', 2.5),
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>',
    pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z" fill="currentColor"/></svg>',
    left: svg('<path d="M19 12H5.5M11 6l-6 6 6 6"/>', 2.5),
    right: svg('<path d="M5 12h13.5M13 6l6 6-6 6"/>', 2.5),
    chevL: svg('<path d="M14.5 6l-6 6 6 6"/>', 2.5),
    chevR: svg('<path d="M9.5 6l6 6-6 6"/>', 2.5),
    chevD: svg('<path d="M6 9.5l6 6 6-6"/>', 3),
    plus: svg('<path d="M12 4v16M4 12h16"/>', 3.5),
    check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 3),
    heart: svg('<path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/>'),
    sun: svg('<circle cx="12" cy="12" r="3.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>'),
    shuffle: svg('<path d="M3 7h3.5c2 0 3.2 1 4.5 3l2 4c1.3 2 2.5 3 4.5 3H21M18 14l3 3-3 3M3 17h3.5c1.2 0 2.1-.4 2.9-1.1M14.6 8.1c.8-.7 1.7-1.1 2.9-1.1H21M18 4l3 3-3 3"/>'),
  };
  const PERSON = '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="38" r="18" fill="none" stroke="#8c8c8c" stroke-width="5"/><path d="M16 93a34 32 0 0 1 68 0" fill="none" stroke="#8c8c8c" stroke-width="5"/></svg>';
  const COVER = '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0L100 100M100 0L0 100" stroke="#aaaaaa" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>';

  /* ---------- Avatar ---------- */
  const SW = ['#ffffff', '#ebebeb', '#e0e0e0', '#c4c4c4', '#a6a6a6', '#969696', '#7a7a7a', '#5c5c5c'];
  const AVO = {
    top: ['Hoodie', 'Tee', 'Jacket', 'Sweater'],
    print: ['Bear', 'None', 'Star', 'Stripes', 'Note'],
    hair: ['None', 'Short', 'Long', 'Curly', 'Buzz'],
    hat: ['None', 'Beanie', 'Cap', 'Bucket', 'Headphones'],
    eyes: ['None', 'Dots', 'Happy', 'Sleepy'],
    mouth: ['None', 'Smile', 'Grin', 'Flat'],
    extra: ['None', 'Glasses', 'Freckles', 'Shades'],
  };
  const AV_TABS = [
    { id: 'outfit', label: 'Outfit', rows: [['Top', 'top'], ['Print', 'print']], colors: [['Color', 'outfitColor']] },
    { id: 'hair', label: 'Hair & hats', rows: [['Hair', 'hair'], ['Hat', 'hat']], colors: [['Color', 'hairColor']] },
    { id: 'face', label: 'Face', rows: [['Eyes', 'eyes'], ['Mouth', 'mouth'], ['Extras', 'extra']], colors: [] },
    { id: 'skin', label: 'Skin & bg', rows: [], colors: [['Skin', 'skin'], ['Background', 'bg']] },
  ];
  function avatarSVG(a) {
    const st = 'stroke="#8c8c8c" stroke-width="5"';
    const ink = '#111111';
    const hair = SW[a.hairColor], cloth = SW[a.outfitColor];
    const v = k => AVO[k][a[k]];
    let s = `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="${SW[a.bg]}"/>`;
    if (v('hair') === 'Long') s += `<path d="M29 40a21 21 0 0 1 42 0v26H29z" fill="${hair}" ${st}/>`;
    s += `<path d="M16 93a34 32 0 0 1 68 0v7H16z" fill="${cloth}"/><path d="M16 93a34 32 0 0 1 68 0" fill="none" ${st}/>`;
    s += `<circle cx="50" cy="38" r="18" fill="${SW[a.skin]}" ${st}/>`;
    const hr = v('hair');
    if (hr === 'Short' || hr === 'Long') s += `<path d="M32 36a18 18 0 0 1 36 0c-6-6-12-8-18-8s-12 2-18 8z" fill="${hair}" ${st}/>`;
    if (hr === 'Curly') s += [34, 42, 50, 58, 66].map((x, i) => `<circle cx="${x}" cy="${i % 2 ? 22 : 25}" r="6" fill="${hair}" ${st}/>`).join('');
    if (hr === 'Buzz') s += `<path d="M33 32a18 18 0 0 1 34 0" fill="none" stroke="${hair === '#ffffff' ? '#8c8c8c' : hair}" stroke-width="6"/>`;
    const e = v('eyes');
    if (e === 'Dots') s += `<circle cx="43" cy="37" r="2.4" fill="${ink}"/><circle cx="57" cy="37" r="2.4" fill="${ink}"/>`;
    if (e === 'Happy') s += `<path d="M39 38q4-5 8 0M53 38q4-5 8 0" fill="none" stroke="${ink}" stroke-width="2.2"/>`;
    if (e === 'Sleepy') s += `<path d="M39 37h8M53 37h8" stroke="${ink}" stroke-width="2.2"/>`;
    const m = v('mouth');
    if (m === 'Smile') s += `<path d="M44 45q6 5 12 0" fill="none" stroke="${ink}" stroke-width="2.2"/>`;
    if (m === 'Grin') s += `<path d="M43 44h14q-1 7-7 7t-7-7z" fill="${ink}"/>`;
    if (m === 'Flat') s += `<path d="M45 46h10" stroke="${ink}" stroke-width="2.2"/>`;
    const x = v('extra');
    if (x === 'Glasses') s += `<circle cx="43" cy="37" r="5.5" fill="none" stroke="${ink}" stroke-width="2"/><circle cx="57" cy="37" r="5.5" fill="none" stroke="${ink}" stroke-width="2"/><path d="M48.5 37h3" stroke="${ink}" stroke-width="2"/>`;
    if (x === 'Shades') s += `<path d="M36 33h12v6q-6 4-12 0zM52 33h12v6q-6 4-12 0z" fill="${ink}"/><path d="M48 34h4" stroke="${ink}" stroke-width="2"/>`;
    if (x === 'Freckles') s += [[41, 43], [44, 45], [56, 43], [59, 45]].map(([cx, cy]) => `<circle cx="${cx}" cy="${cy}" r="1" fill="${ink}"/>`).join('');
    const h = v('hat');
    if (h === 'Beanie') s += `<path d="M31 30a19 19 0 0 1 38 0z" fill="${hair}" ${st}/><rect x="30" y="28" width="40" height="7" fill="${hair}" ${st}/>`;
    if (h === 'Cap') s += `<path d="M31 31a19 17 0 0 1 38 0z" fill="${hair}" ${st}/><path d="M60 31h20" ${st}/>`;
    if (h === 'Bucket') s += `<path d="M36 17h28l4 13H32z" fill="${hair}" ${st}/><path d="M26 31h48" ${st}/>`;
    if (h === 'Headphones') s += `<path d="M30 38a20 20 0 0 1 40 0" fill="none" stroke="${ink}" stroke-width="3"/><rect x="26" y="34" width="7" height="13" fill="${ink}"/><rect x="67" y="34" width="7" height="13" fill="${ink}"/>`;
    return s + '</svg>';
  }

  /* ---------- State ---------- */
  const FRIENDS = ['rae', 'pip', 'jules', 'noor', 'dmitri', 'sam', 'lou', 'kit'];
  function initState() {
    return {
      playing: null,
      chips: new Set(),
      requests: ['[handle]'],
      friends: 8,
      comments: 12,
      likes: { p1: { n: 4, on: false }, p2: { n: 2, on: false }, p3: { n: 7, on: false } },
      unread: { c1: true, c3: true },
      spotify: false,
      songComments: [
        { who: '@[someone]', t: '2h', text: '[Their comment about this song]' },
        { who: '@[someone]', t: '1d', text: '[Their comment about this song]' },
      ],
      sendSel: new Set(['rae', 'jules']),
      msgs: [
        { day: 'Today' },
        { from: 'them', text: 'ok you HAVE to hear this' },
        { from: 'them', song: true },
        { stamp: '3h', side: 'them' },
        { from: 'me', text: 'wait this is so good' },
        { from: 'me', text: 'sending you one back later' },
        { stamp: 'Just now', side: 'me' },
      ],
      addState: { rae: 'friends', kit: 'requested', noor: 'add', sam: 'add', lou: 'add' },
      personFriend: true,
      avatar: { tab: 'outfit', top: 0, print: 0, outfitColor: 2, hair: 0, hairColor: 6, hat: 0, eyes: 0, mouth: 0, extra: 0, skin: 2, bg: 2 },
      draft: null,
      inputs: {},
    };
  }
  let S = initState();
  let stack = ['signin'];
  const cur = () => stack[stack.length - 1];

  /* ---------- Template helpers ---------- */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const val = id => esc(S.inputs[id] || '');
  const av = (sz, extra = '') => `<span class="av ${sz < 44 ? 'thin' : ''}" style="--sz:${sz}px" ${extra}>${PERSON}</span>`;
  const art = sz => `<span class="art" style="--sz:${sz}px"></span>`;
  const play = (key, cls = '') => {
    const on = S.playing === key;
    return `<button class="play ${cls} ${on ? 'on' : ''}" type="button" data-action="play" data-key="${key}" aria-label="${on ? 'Pause' : 'Play'} preview">${on ? ic.pause : ic.play}</button>`;
  };
  const songRow = (key, opts = {}) => `<li><button class="row-main" type="button" ${opts.action ? `data-action="${opts.action}" data-key="${key}"` : 'data-go="song"'}>${opts.rank ? `<span class="rank">${opts.rank}</span>` : ''}${art(52)}<span class="tt"><b>[Song title]</b><span>[Artist]</span></span></button>${play(key)}</li>`;
  const searchBox = (id, ph, form) => `<form class="search" data-form="${form}" role="search">${ic.search}<input id="${id}" type="search" placeholder="${ph}" value="${val(id)}" autocomplete="off" aria-label="${ph}"></form>`;
  function tabbar(active) {
    const t = (id, label, icon) => `<button class="tab ${active === id ? 'on' : ''}" type="button" data-go="${id}" data-mode="tab" ${active === id ? 'aria-current="page"' : ''}>${icon}<span>${label}</span></button>`;
    return `<nav class="tabbar" aria-label="Main">${t('discover', 'Discover', ic.compass)}${t('friends', 'Friends', ic.people)}<span class="fab-slot"><button class="fab" type="button" data-go="drop-pick" aria-label="Drop a song">${ic.plus}</button></span>${t('chats', 'Chats', ic.chat)}${t('profile', 'Profile', ic.smile)}</nav>`;
  }
  const sheet = (inner, foot = '') => `<div class="scr sheet"><button class="scrim" type="button" data-action="dismiss" aria-label="Close"></button><div class="sheet-body"><span class="grabber"></span><div class="scroll">${inner}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ''}</div></div>`;
  const stepper = step => `<div class="stepper" aria-label="Step ${step} of 2"><span class="step ${step === 1 ? 'on' : ''}"><i>${step === 1 ? '1' : ic.check}</i>Pick a song</span><hr><span class="step ${step === 2 ? 'on' : 'todo'}"><i>2</i>Say why</span></div>`;

  /* ---------- Screens ---------- */
  const SCREENS = {
    signin: () => `<div class="scr"><div class="scroll signin">
      <h1 class="h-xl">Sleeve</h1>
      <p class="tagline">Say what songs mean to you. Share them with your friends.</p>
      <form class="card sh form" data-form="signin">
        <label class="label" for="si-email">Email</label>
        <input class="field" id="si-email" type="email" placeholder="you@example.com" value="${val('si-email')}" autocomplete="off">
        <label class="label" for="si-pass">Password</label>
        <input class="field" id="si-pass" type="password" placeholder="8+ characters" autocomplete="off">
        <button class="btn pri sh big block" type="submit">Sign in</button>
        <button class="link" type="button" data-missing="Forgot password">Forgot password?</button>
      </form>
      <div class="or">or</div>
      <div class="alt">
        <button class="btn block" type="button" data-go="discover" data-mode="tab">Continue with Apple</button>
        <button class="btn block" type="button" data-go="discover" data-mode="tab">Continue with Google</button>
      </div>
      <button class="link" type="button" data-missing="Create an account">New here? Create an account</button>
    </div></div>`,

    discover: () => `<div class="scr"><div class="scroll">
      <div class="head"><h1 class="h-page">Discover</h1><p class="lead">Find a song, hear a preview, read what people think.</p></div>
      ${searchBox('disc-q', 'Search songs or artists', 'search')}
      <div class="chips">${['Rainy day', 'Gym', 'Road trip', 'Focus', 'Throwbacks'].map(c => `<button class="chip" type="button" data-action="chip" data-key="${c}" aria-pressed="${S.chips.has(c)}">${c}</button>`).join('')}</div>
      <section class="card sh fill talk">
        <h2 class="h-card">Your friends are talking about</h2>
        <button class="talk-item" type="button" data-go="song"><b>[Song title] · [Artist]</b> (3 comments)</button>
        <button class="talk-item" type="button" data-go="song"><b>[Song title] · [Artist]</b> (1 comment)</button>
      </section>
      <section class="sec"><h2 class="h-sec">Top charts</h2>

    'add-friends': () => `<div class="scr"><div class="scroll">

    avatar: () => {

        <hr class="rule">

          ${tab.rows.map(([label, k]) => `<div class="opt"><span>${label}</span><button class="icon-btn" type="button" data-action="cycle" data-key="${k}:-1" aria-label="Previous ${label}">${ic.chevL}</button><output>${AVO[k][d[k]]}</output><button class="icon-btn" type="button" data-action="cycle" data-key="${k}:1" aria-label="Next ${label}">${ic.chevR}</button></div>`).join('')}
          ${tab.colors.map(([label, k]) => `<div class="swatch-group"><span>${label}</span><div class="swatches">${SW.map((c, i) => `<button class="sw" type="button" style="background:${c}" data-action="swatch" data-key="${k}:${i}" aria-pressed="${d[k] === i}" aria-label="${label} ${i + 1}"></button>`).join('')}</div></div>`).join('')}

        '<button class="btn pri sh big block" type="button" data-action="saveAvatar">Save avatar</button>');

  function addRows() {
    const q = (S.inputs['add-q'] || '').replace(/^@/, '').trim().toLowerCase();
    const rows = Object.entries(S.addState).filter(([h]) => h.includes(q));
    if (!rows.length) return `<li class="empty">No one called @${esc(q)} yet. Share an invite link instead.</li>`;
    return rows.map(([h, st]) => {
      const label = { friends: 'Friends', requested: 'Requested', add: 'Add' }[st];
      return `<li><button class="row-main" type="button" data-go="person">${av(48)}<span class="tt"><b>@${h}</b><span>[Short bio]</span></span></button><button class="btn add-btn ${st === 'add' ? 'pri' : ''}" type="button" data-action="addFriend" data-key="${h}">${label}</button></li>`;
    }).join('');
  }

  /* ---------- Rendering & navigation ---------- */
  const app = document.getElementById('app');
  const frame = document.getElementById('frame');
  const screen = document.getElementById('screen');
  const orig = document.getElementById('orig');
  const toastEl = document.getElementById('toast');
  const frameList = document.getElementById('frameList');
  const linksEl = document.getElementById('links');
  const pill = document.getElementById('pill');
  const hotToggle = document.getElementById('hotToggle');
  const origToggle = document.getElementById('origToggle');

  function render(anim) {
    const id = cur();
    screen.innerHTML = SCREENS[id]();
    screen.className = 'screen';
    if (anim) { void screen.offsetWidth; screen.classList.add('a-' + anim); }
    afterRender(id);
    updateChrome(id);
  }
  function refresh() {
    const sc = screen.querySelector('.scroll');
    const top = sc ? sc.scrollTop : 0;
    const focusId = document.activeElement && screen.contains(document.activeElement) ? document.activeElement.id : null;
    screen.innerHTML = SCREENS[cur()]();
    screen.className = 'screen';
    const sc2 = screen.querySelector('.scroll');
    if (sc2) sc2.scrollTop = top;
    if (focusId) document.getElementById(focusId)?.focus();
    updateChrome(cur());
  }
  function afterRender(id) {
    if (id === 'conversation') { const m = screen.querySelector('.msgs'); m.scrollTop = m.scrollHeight; }
  }
  function nav(id, mode) {
    if (!SCREENS[id]) return;
    const from = cur();
    if (mode === 'tab') {
      stack = [id];
      render(TABS.includes(from) ? 'fade' : 'push');
      return;
    }
    if (id === from) return;
    stack.push(id);
    const toSheet = byId[id].sheet, fromSheet = byId[from].sheet;
    render(toSheet && !fromSheet ? 'up' : 'push');
  }
  function back() {
    if (stack.length < 2) return;
    const leaving = stack.pop();
    if (leaving === 'avatar') S.draft = null;
    render(byId[leaving].sheet && !byId[cur()].sheet ? 'fade' : 'back');
  }
  function popWhile(pred) {
    while (stack.length > 1 && pred(cur())) stack.pop();
    render('fade');
  }
  function jump(id) {
    const f = byId[id];
    if (!f) return;
    stack = [...(f.chain || []), id];
    if (id !== 'avatar') S.draft = null;
    render('fade');
  }

  let toastTimer;
  function toast(msg) {
    toastEl.innerHTML = `<span>${esc(msg)}</span>`;
    toastEl.style.bottom = screen.querySelector('.tabbar, .sheet-foot, .composer-bar') ? '' : '40px';
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  let flashTimer;
  function flashHotspots() {
    if (hotToggle.checked) return;
    frame.classList.add('hot');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => frame.classList.toggle('hot', hotToggle.checked), 650);
  }

  /* ---------- Actions ---------- */
  const ACTIONS = {
    play: key => { S.playing = S.playing === key ? null : key; refresh(); },
    chip: key => { S.chips.has(key) ? S.chips.delete(key) : S.chips.add(key); refresh(); },
    like: key => { const l = S.likes[key]; l.on = !l.on; l.n += l.on ? 1 : -1; refresh(); },
    accept: () => { S.requests = []; S.friends += 1; refresh(); toast('You and @[handle] are friends now'); },
    decline: () => { S.requests = []; refresh(); toast('Request declined'); },
    read: key => { S.unread[key] = false; },
    spotify: () => { S.spotify = !S.spotify; refresh(); toast(S.spotify ? 'Spotify connected' : 'Spotify disconnected'); },
    pick: () => nav('drop-why'),
    closeDrop: () => popWhile(id => id.startsWith('drop-')),
    dismiss: () => (cur().startsWith('drop-') ? ACTIONS.closeDrop() : back()),
    sendPick: key => { S.sendSel.has(key) ? S.sendSel.delete(key) : S.sendSel.add(key); refresh(); },
    send: () => { const n = S.sendSel.size; S.inputs['send-msg'] = ''; back(); toast(`Sent to ${n} friend${n > 1 ? 's' : ''}`); },
    personFriend: () => {
      S.personFriend = !S.personFriend; S.friends += S.personFriend ? 1 : -1; refresh();
      toast(S.personFriend ? 'Friend request sent' : 'Removed from friends');
    },
    addFriend: key => {
      const st = S.addState[key];
      if (st === 'friends') return nav('person');
      S.addState[key] = st === 'add' ? 'requested' : 'add';
      document.getElementById('add-list').innerHTML = addRows();
      toast(st === 'add' ? `Request sent to @${key}` : `Request to @${key} cancelled`);
    },
    avTab: key => { S.draft.tab = key; refresh(); },
    cycle: key => { const [k, dir] = key.split(':'); const len = AVO[k].length; S.draft[k] = (S.draft[k] + Number(dir) + len) % len; refresh(); },
    swatch: key => { const [k, i] = key.split(':'); S.draft[k] = Number(i); refresh(); },
    shuffle: () => {
      const r = n => Math.floor(Math.random() * n);
      Object.keys(AVO).forEach(k => { S.draft[k] = r(AVO[k].length); });
      ['outfitColor', 'hairColor', 'skin', 'bg'].forEach(k => { S.draft[k] = r(SW.length); });
      refresh();
    },
    saveAvatar: () => { S.avatar = { ...S.draft }; back(); toast('Avatar saved'); },
  };

  const FORMS = {
    signin: () => nav('discover', 'tab'),
    search: () => toast('No frame for search results yet'),
    addsearch: () => {},
    drop: () => {
      const note = (S.inputs['drop-note'] || '').trim();
      S.songComments.unshift({ who: '@[you]', t: 'now', text: note || '[Your note]', mine: true });
      S.comments += 1;
      S.inputs['drop-note'] = '';
      popWhile(id => id.startsWith('drop-'));
      toast('Dropped. Your friends will see it in their feed');
    },
    comment: () => {
      const text = (S.inputs['song-c'] || '').trim();
      if (!text) { toast('Write something first'); document.getElementById('song-c').focus(); return; }
      S.songComments.unshift({ who: '@[you]', t: 'now', text, mine: true });
      S.comments += 1;
      S.inputs['song-c'] = '';
      refresh();
      toast('Comment posted');
    },
    msg: () => {
      const text = (S.inputs['msg-in'] || '').trim();
      if (!text) return;
      const last = S.msgs[S.msgs.length - 1];
      if (last && last.stamp && last.side === 'me') S.msgs.splice(S.msgs.length - 1, 0, { from: 'me', text });
      else S.msgs.push({ from: 'me', text }, { stamp: 'Just now', side: 'me' });
      S.inputs['msg-in'] = '';
      refresh();
      afterRender('conversation');
      document.getElementById('msg-in').focus();
    },
  };

  screen.addEventListener('click', e => {
    const t = e.target.closest('[data-go],[data-back],[data-action],[data-missing]');
    if (!t) {
      if (!e.target.closest('input, textarea, label, button, form.search')) flashHotspots();
      return;
    }
    if (t.disabled) return;
    if (t.dataset.action) ACTIONS[t.dataset.action](t.dataset.key, t);
    if (t.dataset.missing) toast(`No frame for “${t.dataset.missing}” yet`);
    if ('back' in t.dataset) back();
    if (t.dataset.go) nav(t.dataset.go, t.dataset.mode);
  });
  screen.addEventListener('submit', e => {
    e.preventDefault();
    FORMS[e.target.dataset.form]?.(e.target);
  });
  screen.addEventListener('input', e => {
    const el = e.target;
    if (!el.id) return;
    S.inputs[el.id] = el.value;
    if (el.id === 'drop-note') document.getElementById('drop-count').textContent = `${el.value.length}/500`;
    if (el.id === 'add-q') document.getElementById('add-list').innerHTML = addRows();
  });

  /* ---------- Chrome ---------- */
  function buildFrameList() {
    let html = '', group = '';
    FRAMES.forEach((f, i) => {
      if (f.group !== group) { group = f.group; html += `<p class="group">${group}</p>`; }
      html += `<button class="fr" type="button" data-frame="${f.id}"><span class="n">${String(i + 1).padStart(2, '0')}</span>${f.name}${f.sheet ? '<span class="tag">Sheet</span>' : ''}</button>`;
    });
    frameList.innerHTML = html;
  }
  function updateChrome(id) {
    const f = byId[id];
    frameList.querySelectorAll('.fr').forEach(b => b.setAttribute('aria-current', String(b.dataset.frame === id)));
    document.getElementById('frameName').textContent = f.name;
    document.getElementById('frameNum').textContent = `${String(f.n).padStart(2, '0')} / ${FRAMES.length}`;
    pill.innerHTML = `${String(f.n).padStart(2, '0')}/${FRAMES.length} · ${esc(f.name)} ${ic.chevD}`;
    orig.src = 'wireframes/' + f.file;
    orig.alt = `Original ${f.name} wireframe`;
    const targets = [];
    const seen = new Set();
    screen.querySelectorAll('[data-go]').forEach(el => {
      const go = el.dataset.go;
      if (seen.has(go) || go === id) return;
      seen.add(go);
      targets.push({ go, el });
    });
    let html = '';
    const backEl = screen.querySelector('[data-back]') || screen.querySelector('[data-action="dismiss"]');
    if (stack.length > 1 && backEl) html += `<button type="button" data-link="back">← ${esc(byId[stack[stack.length - 2]].name)}</button>`;
    html += targets.map((t, i) => `<button type="button" data-link="${i}">${esc(byId[t.go].name)}</button>`).join('');
    linksEl.innerHTML = html || '<span class="none">None. Use the frame list.</span>';
    linksEl.onclick = e => {
      const b = e.target.closest('[data-link]');
      if (!b) return;
      if (b.dataset.link === 'back') backEl.click();
      else targets[Number(b.dataset.link)].el.click();
      closePanel();
    };
    try { history.replaceState(null, '', '#' + id); } catch (err) { /* hash is optional */ }
  }

  function closePanel() { app.classList.remove('open'); pill.setAttribute('aria-expanded', 'false'); }
  frameList.addEventListener('click', e => {
    const b = e.target.closest('[data-frame]');
    if (!b) return;
    jump(b.dataset.frame);
    closePanel();
  });
  pill.addEventListener('click', () => { app.classList.add('open'); pill.setAttribute('aria-expanded', 'true'); });
  document.getElementById('panelClose').addEventListener('click', closePanel);
  const step = d => { const i = byId[cur()].n - 1; jump(FRAMES[(i + d + FRAMES.length) % FRAMES.length].id); };
  document.getElementById('prevBtn').addEventListener('click', () => step(-1));
  document.getElementById('nextBtn').addEventListener('click', () => step(1));
  document.getElementById('restartBtn').addEventListener('click', () => { S = initState(); stack = ['signin']; render('fade'); closePanel(); });
  hotToggle.addEventListener('change', () => frame.classList.toggle('hot', hotToggle.checked));
  origToggle.addEventListener('change', () => { orig.hidden = !origToggle.checked; });
  document.addEventListener('keydown', e => {
    if (e.target.closest('input:not([type="checkbox"]), textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'h' || e.key === 'H') { hotToggle.checked = !hotToggle.checked; hotToggle.dispatchEvent(new Event('change')); }
    else if (e.key === 'o' || e.key === 'O') { origToggle.checked = !origToggle.checked; origToggle.dispatchEvent(new Event('change')); }
    else if (e.key === 'Escape') { if (app.classList.contains('open')) closePanel(); else if (stack.length > 1) (screen.querySelector('[data-action="dismiss"]') ? ACTIONS.dismiss() : back()); }
  });

  /* Scale the 390x844 frame to fit the canvas */
  const stage = document.getElementById('stage');
  const frameBox = document.getElementById('frameBox');
  const mobile = matchMedia('(max-width: 719px)');
  function fit() {
    if (mobile.matches) { frameBox.style.setProperty('--s', 1); return; }
    const cs = getComputedStyle(stage);
    const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const s = Math.max(0.35, Math.min(1, w / 390, h / 844));
    frameBox.style.setProperty('--s', s.toFixed(4));
  }
  new ResizeObserver(fit).observe(stage);
  fit();

  buildFrameList();
  const start = location.hash.slice(1);
  if (byId[start] && start !== 'signin') jump(start); else render();
})();
</script>
</body>
