<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sleeve Lo-fi Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <aside class="panel" id="panel" aria-label="Prototype controls">
    <div class="panel-head">
      <div>
        <p class="eyebrow">Lo-fi prototype</p>
        <h1>Sleeve</h1>
        <p class="panel-sub">13 frames, one at a time. Tap through it like the real app, or jump to any frame here.</p>
      </div>
      <button class="panel-close" id="panelClose" type="button">Done</button>
    </div>
    <nav class="frames" id="frameList" aria-label="Frames"></nav>
    <section class="box" aria-labelledby="linksTitle">
      <h2 id="linksTitle">Links from this frame</h2>
      <div class="links" id="links"></div>
    </section>
    <section class="box" aria-label="View options">
      <label class="switch" for="hotToggle"><input type="checkbox" id="hotToggle"> Show hotspots <kbd>H</kbd></label>
      <label class="switch" for="origToggle"><input type="checkbox" id="origToggle"> Overlay original frame <kbd>O</kbd></label>
      <div class="ctl-row">
        <button class="ctl" id="prevBtn" type="button">← Prev</button>
        <button class="ctl" id="nextBtn" type="button">Next →</button>
        <button class="ctl" id="restartBtn" type="button">Restart</button>
      </div>
      <p class="tip">Click anywhere that isn’t clickable and the hotspots flash blue. Arrow keys step through frames; Esc goes back.</p>
    </section>
  </aside>

  <main class="stage" id="stage">
    <div class="frame-box" id="frameBox">
      <div class="frame-label"><span><b id="frameName">Sign in</b></span><span id="frameNum">01 / 13</span></div>
      <div class="frame" id="frame">
        <div class="screen" id="screen" data-screen="signin"></div>
        <img class="orig" id="orig" alt="" hidden>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </div>
    <button class="pill" id="pill" type="button" aria-controls="panel" aria-expanded="false"></button>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
